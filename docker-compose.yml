services:
  telecodex:
    build: .
    env_file: .env
    volumes:
      - type: bind
        source: ${HOST_CODEX_PATH:-${USERPROFILE}/.codex}
        target: /home/telecodex/.codex
      - type: bind
        source: ${HOST_WORKSPACE_PATH:-./workspace}
        target: /workspace
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped
